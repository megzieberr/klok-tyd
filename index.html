<!doctype html>
<html lang="af">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Hoe laat is dit?</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23FFFDF8' stroke='%231F2A44' stroke-width='5'/%3E%3Cline x1='32' y1='32' x2='32' y2='12' stroke='%23E0533D' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='32' y1='32' x2='44' y2='38' stroke='%232F6DB5' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F0E4; --card:#FFFDF8; --ink:#1F2A44; --muted:#5B6478; --line:#E4DACA;
  --tomato:#E0533D; --tomato-dark:#A83A28; --blue:#2F6DB5; --mustard:#F2B33D;
  --lcd-bg:#16201A; --lcd-on:#8EF06A; --lcd-off:rgba(142,240,106,.10);
  --ok:#2E8B57; --ok-bg:#E3F3E9; --no-bg:#FCE9E4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:18px;line-height:1.4;
  background-image:radial-gradient(rgba(31,42,68,.06) 1px, transparent 1px);background-size:22px 22px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1,h2,.display{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;margin:0}
h1{font-size:clamp(2.2rem,8vw,3.3rem);line-height:1.05;letter-spacing:-.5px}
.sub{color:var(--muted);margin:.4rem 0 1.2rem;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:3px}

/* home hero */
.hero{display:flex;align-items:center;gap:16px;margin:8px 0 18px}
.hero svg{width:92px;flex:none}

/* toggles */
.settings{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 18px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 16px;font-family:'Fredoka',sans-serif;font-weight:500;font-size:1rem}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg small{font-family:'Nunito',sans-serif;font-weight:700;opacity:.75;font-size:.78rem}

/* mode cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.card{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;
  padding:16px;box-shadow:0 4px 0 var(--line);transition:transform .15s, box-shadow .15s, border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:0 6px 0 var(--ink)}
.card:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.card .icons{display:flex;align-items:center;gap:4px;flex:none;font-size:1.6rem}
.card .icons svg{width:46px;height:46px}
.card .arrow{font-family:'Fredoka';color:var(--muted);font-size:1.3rem}
.card h2{font-size:1.3rem}
.card p{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}

/* practice */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.back{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:6px 14px;font-family:'Fredoka';font-weight:500}
.tally{font-family:'Fredoka';font-weight:500;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px 12px;white-space:nowrap}
.mode-title{font-size:1.5rem;margin:0 0 4px}
.prompt{font-weight:800;font-size:1.15rem;margin:0 0 12px}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.clock-big{width:min(80vw,340px);height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.clock-big.drag{cursor:grab}
.clock-small{width:140px;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:.9rem;font-weight:700;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:6px;border-radius:3px;vertical-align:middle;margin-right:6px}
.badge{font-family:'Fredoka';font-weight:600;font-size:1.25rem;background:var(--ink);color:var(--card);border-radius:10px;padding:4px 14px}
.badge small{font-family:'Nunito';font-weight:700;font-size:.8rem;opacity:.8;margin-left:6px}

/* the LCD */
.lcd{background:linear-gradient(#4A505A,#2C3038);border-radius:20px;padding:12px;box-shadow:0 5px 0 #1A1D22, inset 0 1px 0 rgba(255,255,255,.15)}
.lcd svg{display:block;background:var(--lcd-bg);border-radius:10px;width:min(80vw,340px);height:auto}
.lcd.small{padding:7px;border-radius:12px;box-shadow:0 3px 0 #1A1D22}
.lcd.small svg{width:140px;border-radius:6px}
.lcd .on{fill:var(--lcd-on);filter:drop-shadow(0 0 3px rgba(142,240,106,.55))}
.lcd .off{fill:var(--lcd-off)}

/* actions */
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:16px}
.btn{border:0;border-radius:14px;padding:13px 26px;font-family:'Fredoka';font-weight:600;font-size:1.25rem;background:var(--tomato);color:#fff;box-shadow:0 4px 0 var(--tomato-dark)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tomato-dark)}
.btn.next{background:var(--ink);box-shadow:0 4px 0 #0D1324}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.time-in{font-family:'Fredoka';font-weight:600;font-size:2rem;width:6.2ch;text-align:center;border:3px solid var(--ink);border-radius:14px;padding:6px 8px;background:var(--card);color:var(--ink)}
.hint{width:100%;text-align:center;color:var(--tomato-dark);font-weight:800;min-height:1.4em;margin:0}

/* reveal */
.reveal{margin-top:18px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:center;animation:up .3s ease-out}
.verdict{font-family:'Fredoka';font-weight:600;font-size:1.3rem;border-radius:12px;padding:6px 12px;display:inline-block;margin-bottom:10px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.no{background:var(--no-bg);color:var(--tomato-dark)}
.words{font-family:'Fredoka';font-weight:600;font-size:clamp(1.6rem,6.5vw,2.3rem);line-height:1.15;margin:4px 0 14px}
.words span{background:linear-gradient(transparent 62%, rgba(242,179,61,.55) 62%);padding:0 4px}
.pair{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:center}
.pair figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.pair figcaption{font-weight:800;font-size:.85rem;color:var(--muted)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
// ---------- time words (Afrikaans, her class's way) ----------
const NUM=['nul','een','twee','drie','vier','vyf','ses','sewe','agt','nege','tien','elf','twaalf',
  'dertien','veertien','vyftien','sestien','sewentien','agttien','negentien','twintig'];
function num(n){return n<=20?NUM[n]:NUM[n-20]+'-en-twintig';}
function h12(h){const x=h%12;return x===0?12:x;}
function minPart(k){return k%5===0?num(k):num(k)+(k===1?' minuut':' minute');}
function timeWords(h24,m,fmt){
  const h=h12(h24), nxt=h12(h24+1);
  let s;
  if(m===0) s=NUM[h]+' uur';
  else if(m===15) s='kwart oor '+NUM[h];
  else if(m===30) s='half '+NUM[nxt];
  else if(m===45) s='kwart voor '+NUM[nxt];
  else if(m<30) s=minPart(m)+' oor '+NUM[h];
  else s=minPart(60-m)+' voor '+NUM[nxt];
  if(fmt==='24') s+=(h24<12?' vm':' nm');
  return s;
}
function pad(n){return String(n).padStart(2,'0');}
function digitalText(h24,m,fmt){return (fmt==='24'?pad(h24):String(h12(h24)))+':'+pad(m);}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

// ---------- analogue clock (SVG, viewBox 200x200) ----------
const FACE=(()=>{
  let s='<circle cx="100" cy="100" r="95" fill="#FFFDF8" stroke="#1F2A44" stroke-width="6"/>'+
        '<circle cx="100" cy="100" r="88" fill="none" stroke="#E4DACA" stroke-width="1.5"/>';
  for(let i=0;i<60;i++){
    const a=i*6*Math.PI/180, big=i%5===0, r1=86, r2=big?75:81;
    s+=`<line x1="${(100+r1*Math.sin(a)).toFixed(2)}" y1="${(100-r1*Math.cos(a)).toFixed(2)}" x2="${(100+r2*Math.sin(a)).toFixed(2)}" y2="${(100-r2*Math.cos(a)).toFixed(2)}" stroke="#1F2A44" stroke-width="${big?3.2:1.3}" stroke-linecap="round"/>`;
  }
  for(let i=1;i<=12;i++){
    const a=i*30*Math.PI/180;
    s+=`<text x="${(100+63*Math.sin(a)).toFixed(2)}" y="${(100-63*Math.cos(a)).toFixed(2)}" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="17" fill="#1F2A44">${i}</text>`;
  }
  return s;
})();
function handAngles(h,m){return {hr:((h%12)+m/60)*30, mn:m*6};}
function analogSVG(h,m,{cls='clock-big',drag=false,label='Analoog klok'}={}){
  const {hr,mn}=handAngles(h,m);
  return `<svg class="${cls}${drag?' drag':''}" viewBox="0 0 200 200" role="img" aria-label="${label}">${FACE}
    <g class="hand-h" transform="rotate(${hr} 100 100)"><line x1="100" y1="113" x2="100" y2="53" stroke="#2F6DB5" stroke-width="8" stroke-linecap="round"/>${drag?'<circle cx="100" cy="55" r="8" fill="#2F6DB5" stroke="#fff" stroke-width="2.5"/>':''}</g>
    <g class="hand-m" transform="rotate(${mn} 100 100)"><line x1="100" y1="116" x2="100" y2="${drag?20:24}" stroke="#E0533D" stroke-width="4.5" stroke-linecap="round"/>${drag?'<circle cx="100" cy="19" r="7.5" fill="#E0533D" stroke="#fff" stroke-width="2.5"/>':''}</g>
    <circle cx="100" cy="100" r="6.5" fill="#1F2A44"/><circle cx="100" cy="100" r="2.6" fill="#F2B33D"/></svg>`;
}
function setHands(svg,h,m){
  const {hr,mn}=handAngles(h,m);
  svg.querySelector('.hand-h').setAttribute('transform',`rotate(${hr} 100 100)`);
  svg.querySelector('.hand-m').setAttribute('transform',`rotate(${mn} 100 100)`);
}

// ---------- digital clock (7-segment, ghost segments visible) ----------
const DW=36, DH=64, T=7;
const SEGS={
  a:hSeg(T/2), g:hSeg(DH/2), d:hSeg(DH-T/2),
  f:vSeg(T/2,0,DH/2), b:vSeg(DW-T/2,0,DH/2), e:vSeg(T/2,DH/2,DH), c:vSeg(DW-T/2,DH/2,DH)
};
function hSeg(y){const x0=T/2,x1=DW-T/2,k=T/2;
  return [[x0+1,y],[x0+1+k,y-k],[x1-1-k,y-k],[x1-1,y],[x1-1-k,y+k],[x0+1+k,y+k]].map(p=>p.join(',')).join(' ');}
function vSeg(x,y0,y1){const k=T/2;
  return [[x,y0+1],[x+k,y0+1+k],[x+k,y1-1-k],[x,y1-1],[x-k,y1-1-k],[x-k,y0+1+k]].map(p=>p.join(',')).join(' ');}
const DIGIT={'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd','6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg',' ':''};
function digitSVG(ch,x){
  const on=DIGIT[ch]||'';
  let s=`<g transform="translate(${x} 14) skewX(-6)">`;
  for(const k in SEGS) s+=`<polygon points="${SEGS[k]}" class="${on.includes(k)?'on':'off'}"/>`;
  return s+'</g>';
}
function digitalSVG(h24,m,fmt){
  const hs=fmt==='24'?pad(h24):String(h12(h24)).padStart(2,' ');
  const ms=pad(m);
  return `<svg viewBox="0 0 222 92" role="img" aria-label="Digitale horlosie">`+
    digitSVG(hs[0],16)+digitSVG(hs[1],60)+
    `<circle cx="108" cy="36" r="4.2" class="on"/><circle cx="105" cy="62" r="4.2" class="on"/>`+
    digitSVG(ms[0],124)+digitSVG(ms[1],168)+`</svg>`;
}
function digitalBox(h24,m,fmt,small){return `<div class="lcd${small?' small':''}">${digitalSVG(h24,m,fmt)}</div>`;}

// ---------- state ----------
const MODES={
  1:{title:'Wysers → sê dit',blurb:'Lees die analoog klok en sê die tyd hardop.',from:'a',to:'🗣️'},
  2:{title:'Wysers → tik digitaal',blurb:'Lees die analoog klok en tik die tyd digitaal.',from:'a',to:'⌨️'},
  3:{title:'Digitaal → sê dit',blurb:'Lees die digitale horlosie en sê die tyd hardop.',from:'d',to:'🗣️'},
  4:{title:'Digitaal → trek wysers',blurb:'Lees die digitale horlosie en trek die wysers.',from:'d',to:'👆'}
};
const S={mode:null,level:'maklik',fmt:'12',h:0,m:0,phase:'ask',right:0,total:0,count:0,dh:0,dm:0,drag:null};
try{const saved=JSON.parse(localStorage.getItem('kloktyd')||'{}');
  if(saved.level==='maklik'||saved.level==='moeilik') S.level=saved.level;
  if(saved.fmt==='12'||saved.fmt==='24') S.fmt=saved.fmt;}catch(e){}
function saveSettings(){try{localStorage.setItem('kloktyd',JSON.stringify({level:S.level,fmt:S.fmt}));}catch(e){}}
const app=document.getElementById('app');

function settingsHTML(){
  const p=(a,b)=>a===b?'true':'false';
  return `<div class="settings">
    <div class="seg" role="group" aria-label="Moeilikheid">
      <button data-act="level" data-v="maklik" aria-pressed="${p(S.level,'maklik')}">Maklik <small>elke 5 min</small></button>
      <button data-act="level" data-v="moeilik" aria-pressed="${p(S.level,'moeilik')}">Moeilik <small>elke minuut</small></button>
    </div>
    <div class="seg" role="group" aria-label="Digitale formaat">
      <button data-act="fmt" data-v="12" aria-pressed="${p(S.fmt,'12')}">12-uur</button>
      <button data-act="fmt" data-v="24" aria-pressed="${p(S.fmt,'24')}">24-uur <small>vm / nm</small></button>
    </div></div>`;
}
const MINI_A=analogSVG(3,20,{cls:'',label:''}).replace('<svg','<svg aria-hidden="true"');
const MINI_D=`<svg viewBox="0 0 46 46" aria-hidden="true"><rect x="1" y="9" width="44" height="28" rx="6" fill="#16201A" stroke="#3A3F47" stroke-width="2"/><text x="23" y="28.5" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="14" fill="#8EF06A">3:20</text></svg>`;

function renderHome(){
  S.mode=null;
  app.innerHTML=`<div class="hero">${analogSVG(10,10,{cls:'',label:'Horlosie'})}<div><h1>Hoe laat is dit?</h1></div></div>
    <p class="sub">Kies hoe jy wil oefen. Jy kan aanhou so lank as wat jy wil.</p>
    ${settingsHTML()}
    <div class="cards">${[1,2,3,4].map(k=>{const md=MODES[k];return `
      <button class="card" data-act="mode" data-v="${k}">
        <span class="icons">${md.from==='a'?MINI_A:MINI_D}<span class="arrow">→</span><span>${md.to}</span></span>
        <span><h2>${md.title}</h2><p>${md.blurb}</p></span>
      </button>`;}).join('')}</div>`;
}

function renderPractice(){
  const md=MODES[S.mode];
  app.innerHTML=`<div class="top"><button class="back" data-act="home">← Terug</button><span class="tally" id="tally"></span></div>
    <h2 class="mode-title">${md.title}</h2>${settingsHTML()}<div id="q"></div>`;
  nextQuestion();
}

function newTime(){
  let h,m,guard=0;
  do{
    h=Math.floor(Math.random()*24);
    m=S.level==='maklik'?5*Math.floor(Math.random()*12):Math.floor(Math.random()*60);
  }while(h%12===S.h%12&&m===S.m&&guard++<20);
  S.h=h;S.m=m;
}
function updateTally(){
  const t=document.getElementById('tally'); if(!t) return;
  t.textContent=(S.mode===1||S.mode===3)?`Tyd nr. ${S.count}`:`Reg: ${S.right} / ${S.total}`;
}
const LEGEND=`<div class="legend"><span><i style="background:#2F6DB5"></i>kort wyser: ure</span><span><i style="background:#E0533D"></i>lang wyser: minute</span></div>`;
function badgeHTML(){
  if(S.fmt!=='24') return '';
  return S.h<12?`<span class="badge">vm<small>in die oggend</small></span>`:`<span class="badge">nm<small>in die middag / aand</small></span>`;
}

function nextQuestion(){
  newTime(); S.phase='ask'; S.count++;
  const q=document.getElementById('q');
  let html='';
  if(S.mode===1){
    html=`<p class="prompt">Kyk na die wysers. Sê die tyd hardop in woorde.</p>
      <div class="stage">${analogSVG(S.h,S.m)}${badgeHTML()}${LEGEND}</div>
      <div class="actions"><button class="btn" data-act="show">Wys antwoord</button></div>`;
  }else if(S.mode===2){
    html=`<p class="prompt">Kyk na die wysers. Tik die tyd soos 'n digitale horlosie dit wys.</p>
      <div class="stage">${analogSVG(S.h,S.m)}${badgeHTML()}${LEGEND}</div>
      <form class="actions" id="tform" autocomplete="off">
        <input class="time-in" id="tin" inputmode="decimal" placeholder="${S.fmt==='24'?'15:20':'3:20'}" aria-label="Digitale tyd" maxlength="5">
        <button class="btn" type="submit">Kyk</button>
        <p class="hint" id="hint"></p>
      </form>`;
  }else if(S.mode===3){
    html=`<p class="prompt">Lees die digitale horlosie. Sê die tyd hardop in woorde.</p>
      <div class="stage">${digitalBox(S.h,S.m,S.fmt)}</div>
      <div class="actions"><button class="btn" data-act="show">Wys antwoord</button></div>`;
  }else{
    S.dh=0;S.dm=0;
    html=`<p class="prompt">Trek die wysers sodat die horlosie dieselfde tyd wys.</p>
      <div class="stage">${digitalBox(S.h,S.m,S.fmt)}${analogSVG(0,0,{drag:true,label:'Trek die wysers'})}${LEGEND}</div>
      <div class="actions"><button class="btn" data-act="check4">Kyk</button></div>`;
  }
  q.innerHTML=html+`<div id="reveal"></div>`;
  updateTally();
  if(S.mode===2){
    const f=document.getElementById('tform');
    f.addEventListener('submit',e=>{e.preventDefault();check2();});
    // only focus on devices with a real keyboard, so phones don't pop the keyboard over the clock
    if(window.matchMedia('(pointer:fine)').matches) document.getElementById('tin').focus();
  }
  if(S.mode===4) wireDrag(q.querySelector('svg.drag'));
}

function parseTime(raw){
  const s=raw.trim().replace(/[.,h\s]/g,':');
  let mt=s.match(/^(\d{1,2}):(\d{2})$/);
  if(!mt){const d=s.match(/^(\d{1,2})(\d{2})$/); if(d) mt=d;}
  if(!mt) return null;
  const hh=+mt[1], mm=+mt[2];
  if(mm>59||hh>23) return null;
  return {hh,mm};
}
function check2(){
  if(S.phase!=='ask') return;
  const inp=document.getElementById('tin'), hint=document.getElementById('hint');
  const t=parseTime(inp.value);
  if(!t){hint.textContent=`Tik die tyd so: ${S.fmt==='24'?'15:20':'3:20'}`;inp.focus();return;}
  let ok;
  if(S.fmt==='24') ok=t.hh===S.h&&t.mm===S.m;
  else ok=t.hh>=1&&t.hh<=12&&t.hh%12===S.h%12&&t.mm===S.m;
  hint.textContent='';
  inp.disabled=true;
  reveal(ok);
}
function check4(){
  if(S.phase!=='ask') return;
  reveal(S.dh===S.h%12&&S.dm===S.m);
}

function reveal(ok){
  if(S.phase!=='ask') return;
  S.phase='done';
  if(ok!==null){S.total++; if(ok) S.right++;}
  updateTally();
  document.querySelectorAll('#q .actions button').forEach(b=>b.disabled=true);
  const drag=document.querySelector('#q svg.drag'); if(drag) drag.classList.add('locked');
  let verdict='';
  if(ok===true) verdict=`<div class="verdict ok">✓ Reg!</div>`;
  if(ok===false) verdict=`<div class="verdict no">Nog nie. Kyk mooi:</div>`;
  const yours=(S.mode===4&&ok===false)?`<figure>${analogSVG(S.dh,S.dm,{cls:'clock-small',label:'Jou horlosie'})}<figcaption>Jou horlosie</figcaption></figure>`:'';
  document.getElementById('reveal').innerHTML=`<div class="reveal">${verdict}
    <p class="words"><span>${cap(timeWords(S.h,S.m,S.fmt))}</span></p>
    <div class="pair">${yours}
      <figure>${analogSVG(S.h,S.m,{cls:'clock-small',label:'Die regte tyd'})}<figcaption>${yours?'Die regte tyd':'Wysers'}</figcaption></figure>
      <figure>${digitalBox(S.h,S.m,S.fmt,true)}<figcaption>Digitaal: ${digitalText(S.h,S.m,S.fmt)}</figcaption></figure>
    </div>
    <div class="actions"><button class="btn next" data-act="next">Volgende →</button></div></div>`;
  const nb=document.querySelector('[data-act="next"]');
  nb.focus({preventScroll:true});
  nb.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
}

// ---------- dragging the hands (mode 4) ----------
function wireDrag(svg){
  function pt(e){const r=svg.getBoundingClientRect();
    if(!r.width||!r.height) return {r:0,ang:0};
    const x=(e.clientX-r.left)/r.width*200-100, y=(e.clientY-r.top)/r.height*200-100;
    return {r:Math.hypot(x,y), ang:(Math.atan2(x,-y)*180/Math.PI+360)%360};}
  function diff(a,b){const d=Math.abs(a-b)%360;return d>180?360-d:d;}
  function move(p){
    if(S.drag==='m'){
      const step=S.level==='maklik'?5:1;
      const nm=(Math.round(p.ang/6/step)*step)%60, prev=S.dm;
      if(prev>=45&&nm<15) S.dh=(S.dh+1)%12;
      else if(prev<15&&nm>=45) S.dh=(S.dh+11)%12;
      S.dm=nm;
    }else if(S.drag==='h'){
      S.dh=((Math.round(p.ang/30-S.dm/60)%12)+12)%12;
    }
    setHands(svg,S.dh,S.dm);
  }
  svg.addEventListener('pointerdown',e=>{
    if(S.phase!=='ask') return;
    const p=pt(e); if(p.r<12) return;
    const {hr,mn}=handAngles(S.dh,S.dm), dH=diff(p.ang,hr), dM=diff(p.ang,mn);
    if(p.r<=60&&dH<30) S.drag='h';
    else if(dM<30) S.drag='m';
    else S.drag=p.r>60?'m':'h';
    try{svg.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
    move(p);
  });
  svg.addEventListener('pointermove',e=>{if(S.drag&&S.phase==='ask') move(pt(e));});
  const end=()=>{S.drag=null;};
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
}

// ---------- events ----------
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, v=b.dataset.v;
  if(act==='mode'){S.mode=+v;S.right=0;S.total=0;S.count=0;renderPractice();}
  else if(act==='home') renderHome();
  else if(act==='level'||act==='fmt'){
    S[act]=v; saveSettings();
    if(S.mode){S.count--; document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',S[x.dataset.act]===x.dataset.v?'true':'false')); nextQuestion();}
    else renderHome();
  }
  else if(act==='show') reveal(null);
  else if(act==='check4') check4();
  else if(act==='next'){ if(S.phase==='done') nextQuestion(); }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!S.mode) return;
  const tag=e.target.tagName;
  if(tag==='BUTTON'||tag==='INPUT') return; // native handling, no double-submit
  e.preventDefault();
  if(S.phase==='done') nextQuestion();
  else if(S.mode===1||S.mode===3) reveal(null);
  else if(S.mode===4) check4();
});
renderHome();
</script>
